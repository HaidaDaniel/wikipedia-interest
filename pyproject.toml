[project]
name = "wikipedia-interest"
version = "0.1.0"
description = "Deterministic Wikipedia Pageviews audience-interest analysis skill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
]

[project.scripts]
wikipedia-interest = "wikipedia_interest.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikipedia_interest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

